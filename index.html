<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraStudio — AI Media & Script Generator</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: #161b22;
      --accent: #8a2be2;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; margin-bottom: 8px; }
    header h1 { font-size: 1.5rem; background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { font-size: 0.85rem; color: var(--subtext); margin-top: 4px; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--subtext); display: block; margin-bottom: 6px; }
    select, textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; margin-bottom: 12px; outline: none; }
    select:focus, textarea:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #8a2be2, #4a00e0); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .output-box { display: none; margin-top: 16px; background: #0d1117; padding: 12px; border-radius: 8px; border: 1px dashed var(--border); font-size: 0.9rem; line-height: 1.5; }
    .media-preview { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
    .tag { display: inline-block; background: #21262d; color: #a855f7; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-bottom: 8px; }
    .timeline { margin-top: 10px; padding: 8px; background: #161b22; border-radius: 6px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>AuraStudio AI</h1>
    <p>AI Generator for 60s+ Video Sequences, Outfits & Media</p>
  </header>

  <div class="card">
    <label for="mode">Select Output Mode</label>
    <select id="mode">
      <option value="video">1. 60-Second AI Video Sequence Generator</option>
      <option value="fashion">2. AI Fashion Concept & Visual Outfit</option>
      <option value="quote">3. Dark Aesthetic Quote & Visual Background</option>
    </select>

    <label for="userInput">Describe Theme, Story, or Style</label>
    <textarea id="userInput" rows="3" placeholder="e.g., A dramatic late-night reflection on time and success in a rainy city..."></textarea>

    <button class="btn" onclick="generateMedia()">Generate AI Visuals & Script</button>

    <div id="output" class="output-box"></div>
  </div>
</div>

<script>
  function generateMedia() {
    const mode = document.getElementById('mode').value;
    const input = document.getElementById('userInput').value;
    const output = document.getElementById('output');

    if (!input) {
      alert('Please enter a topic or theme description!');
      return;
    }

    output.style.display = 'block';
    output.innerHTML = '<p>Generating 60-second video prompts and visual media...</p>';

    // Encode prompt for free Pollinations API image rendering
    const encodedPrompt = encodeURIComponent(input + " highly detailed 8k cinematic lighting vertical format");
    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=540&height=960&nologo=true`;

    setTimeout(() => {
      if (mode === 'video') {
        output.innerHTML = `
          <span class="tag">60+ SECOND VIDEO TIMELINE GENERATOR</span>
          <p><b>Topic:</b> ${input}</p>
          
          <div class="timeline">
            <b>🎬 Scene 1 (00:00 - 00:15): The Hook</b><br>
            <i>Prompt:</i> "Dramatic wide shot of ${input}, dark cinematic lighting, slow zoom in, 8k resolution"<br><br>
            <b>🎬 Scene 2 (00:15 - 00:30): Development</b><br>
            <i>Prompt:</i> "Close up shot showing detail and atmospheric motion, rain reflections, highly stylized"<br><br>
            <b>🎬 Scene 3 (00:30 - 00:45): The Climax</b><br>
            <i>Prompt:</i> "High angle dynamic camera angle, moody lighting, fast motion blur, cinematic depth"<br><br>
            <b>🎬 Scene 4 (00:45 - 01:00+): Call To Action / Resolution</b><br>
            <i>Prompt:</i> "Minimalist aesthetic ending frame, ambient lighting, smooth cinematic fade"
          </div>

          <p style="margin-top:10px;"><b>Generated Keyframe Preview:</b></p>
          <img src="${imageUrl}" class="media-preview" alt="AI Generated Visual Preview" />
        `;
      } else if (mode === 'fashion') {
        output.innerHTML = `
          <span class="tag">AI FASHION & VISUAL OUTFIT</span>
          <p><b>Style Concept:</b> ${input}</p>
          <p><b>Outfit Breakdown:</b> Layered aesthetic, oversized silhouette with dark neutral tones.</p>
          
          <p style="margin-top:10px;"><b>AI Visual Model Render:</b></p>
          <img src="${imageUrl}" class="media-preview" alt="Fashion Visual Render" />
        `;
      } else {
        output.innerHTML = `
          <span class="tag">DARK AESTHETIC QUOTE & VISUAL</span>
          <p><b>Quote:</b> "In the middle of the noise, the quietest minds observe the most."</p>
          <p><b>Caption:</b> " खामोशी सब कुछ कह देती है। / Silence speaks loudest."</p>
          
          <p style="margin-top:10px;"><b>AI Visual Background:</b></p>
          <img src="${imageUrl}" class="media-preview" alt="Aesthetic Background Render" />
        `;
      }
    }, 1200);
  }
</script>

</body>
</html>
